[build]
  command = "npm run build"   # prebuild downloads the map imagery (≈21 MB)
  publish = "dist"

[[headers]]
  for = "/map/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
